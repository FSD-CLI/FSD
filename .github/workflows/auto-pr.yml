name: Auto Pull Request

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          existing_prs=$(gh pr list --base main --head "$HEAD_BRANCH" --state open --json number --jq 'length')
          if [ "$existing_prs" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "chore: merge $HEAD_BRANCH into main" \
              --body "Auto-created PR from \`$HEAD_BRANCH\` to \`main\`."
          fi
