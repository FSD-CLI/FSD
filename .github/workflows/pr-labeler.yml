name: PR Labeler

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Add labels by changed files
    runs-on: ubuntu-latest

    steps:
      - name: Read label configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false
      - name: Label PR
        uses: actions/labeler@v6
