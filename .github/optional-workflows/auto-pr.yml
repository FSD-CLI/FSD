name: Optional manual pull request

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pull request for selected feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$BRANCH_NAME" = "$BASE_BRANCH" ]; then
            echo "Select a feature branch when dispatching this workflow."
            exit 1
          fi
          existing=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH_NAME" \
              --title "chore: merge $BRANCH_NAME into $BASE_BRANCH" \
              --body "Manually requested pull request for $BRANCH_NAME."
          fi
